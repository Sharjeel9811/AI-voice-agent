<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <!-- Ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
  <!-- Mic body -->
  <rect x="26" y="14" width="12" height="20" rx="6" fill="url(#ringGrad)"/>
  <!-- Mic stand -->
  <path d="M20 32 Q20 44 32 44 Q44 44 44 32" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="51" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="51" x2="40" y2="51" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sound waves left -->
  <path d="M18 22 Q10 32 18 42" fill="none" stroke="#6C63FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Sound waves right -->
  <path d="M46 22 Q54 32 46 42" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
