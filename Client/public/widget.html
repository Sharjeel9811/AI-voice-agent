<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceAgent Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: transparent; }
  </style>
</head>
<body>
  <div id="voice-agent-root"></div>
  <script>
    (function() {
      const SCRIPT = document.currentScript || document.querySelector('script[data-user-id]');
      const userId = SCRIPT?.getAttribute('data-user-id');
      if (!userId) { console.error('VoiceAgent: data-user-id is required'); return; }

      const BACKEND = SCRIPT?.src?.replace('/widget.js', '').replace('https://', 'http://').replace(/:\d+/, ':8000') || 'http://localhost:8000';
      const FRONTEND = SCRIPT?.src?.replace('/widget.js', '').replace('/api', '') || 'http://localhost:5173';

      // Create toggle button
      const btn = document.createElement('div');
      btn.id = 'va-toggle-btn';
      btn.innerHTML = `
        <div style="
          width: 56px; height: 56px; border-radius: 50%;
          background: linear-gradient(135deg, #7C5CFC, #5B8DEF);
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; box-shadow: 0 4px 24px rgba(124,92,252,0.4);
          transition: transform 0.2s;
        " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
          <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </div>
      `;
      btn.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:999999;';
      document.body.appendChild(btn);

      // Create chat container
      const FAB_SIZE = 56, GAP = 16, SIDE = 24, NAVBAR_CLEARANCE = 16;
      const bottomOffset = SIDE + FAB_SIZE + GAP;
      const maxHeight = window.innerHeight - bottomOffset - NAVBAR_CLEARANCE;
      const chatHeight = Math.min(520, maxHeight);

      const container = document.createElement('div');
      container.id = 'va-chat-container';
      container.style.cssText = `
        position: fixed; bottom: ${bottomOffset}px; right: ${SIDE}px;
        width: 380px; height: ${chatHeight}px;
        border-radius: 16px; overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        z-index: 999998; display: none;
        border: 1px solid rgba(255,255,255,0.08);
      `;

      const iframe = document.createElement('iframe');
      iframe.src = FRONTEND + '/widget?userId=' + userId;
      iframe.style.cssText = 'width:100%;height:100%;border:none;';
      iframe.allow = 'microphone';
      container.appendChild(iframe);
      document.body.appendChild(container);

      let open = false;
      btn.onclick = function() {
        open = !open;
        container.style.display = open ? 'block' : 'none';
        btn.style.display = open ? 'none' : 'block';
      };

      // Listen for close message from the iframe (Widget.jsx sends 'va-close-chat')
      window.addEventListener('message', function(e) {
        if (e.data === 'va-close-chat') {
          open = false;
          container.style.display = 'none';
          btn.style.display = 'block';
        }
      });

      // Responsive: full screen on mobile
      if (window.innerWidth < 480) {
        container.style.cssText = 'position:fixed;bottom:0;right:0;width:100vw;height:100vh;border-radius:0;overflow:hidden;box-shadow:none;z-index:999998;display:none;border:none;';
      }
    })();
  </script>
</body>
</html>
